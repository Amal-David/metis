name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate local registry and retrieval
        run: |
          python -m unittest discover -s tests -v
          python scripts/retrieve_cases.py --validate
          python scripts/retrieve_cases.py "edge representation" --limit 2 > /dev/null
      - name: Check authored package and frozen arithmetic fixtures
        run: |
          python scripts/validate_package.py
          python evaluation/private/checkers.py
